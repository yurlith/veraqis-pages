<svg viewBox="0 0 720 212" width="100%" height="auto" role="img" aria-labelledby="sqlite-artifacts-t" preserveAspectRatio="xMinYMin meet" xmlns="http://www.w3.org/2000/svg">
<title id="sqlite-artifacts-t">Which SQLite file holds which state</title><desc>Two columns showing the same database file. On the left it is collected together with its write-ahead log, and the latest committed state is provable. On the right the log is absent, and whether the database is current is undecidable — the database file itself is byte-identical in both cases.</desc>
<text x="8" y="18" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600">collected together</text><rect x="8" y="34" width="340" height="40" rx="4" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="20" y="51" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600">app.db</text><text x="20" y="66" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">pages as of the last checkpoint</text><rect x="8" y="84" width="340" height="40" rx="4" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="20" y="101" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600">app.db-wal</text><text x="20" y="116" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">every commit since then</text><rect x="8" y="146" width="340" height="44" rx="4" fill="transparent" stroke="var(--recovery-accent)" stroke-width="1" stroke-dasharray="3 3"/><text x="20" y="173" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--recovery-accent)" font-weight="700">latest state: PROVABLE</text><text x="372" y="18" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600">database copied alone</text><rect x="372" y="34" width="340" height="40" rx="4" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="384" y="51" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600">app.db</text><text x="384" y="66" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">pages as of the last checkpoint</text><rect x="372" y="84" width="340" height="40" rx="4" fill="transparent" stroke="var(--bad)" stroke-width="1" stroke-dasharray="4 3"/><text x="384" y="101" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--bad)" font-weight="600">app.db-wal</text><text x="384" y="116" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">not collected — or never existed</text><rect x="372" y="146" width="340" height="44" rx="4" fill="transparent" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/><text x="384" y="173" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--bad)" font-weight="700">latest state: UNDECIDABLE</text><text x="8" y="204" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">the database file is byte-identical in both columns</text>
</svg>

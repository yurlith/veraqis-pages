<svg viewBox="0 0 720 244" width="100%" height="auto" role="img" aria-labelledby="journal-inversion-t" preserveAspectRatio="xMinYMin meet" xmlns="http://www.w3.org/2000/svg">
<title id="journal-inversion-t">How a hot journal reverses which file holds the committed state</title><desc>Two arrangements side by side. Normally the database file holds the committed state and its companion holds changes not yet folded in. With a hot rollback journal the roles reverse: the database file holds bytes from a transaction that was never committed, and the journal holds what the committed state was. So a provable freshness verdict does not by itself make the rows on disk current.</desc>
<text x="8" y="20" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600">the usual arrangement</text><rect x="8" y="46" width="340" height="62" rx="4" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="20" y="71" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600">the database file</text><text x="20" y="90" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">holds the committed state</text><rect x="8" y="120" width="340" height="62" rx="4" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="20" y="145" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600">the companion</text><text x="20" y="164" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">holds what has not been folded in yet</text><text x="372" y="20" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600">with a hot journal — reversed</text><rect x="372" y="46" width="340" height="62" rx="4" fill="var(--bad)" stroke="var(--line)" stroke-width="1"/><text x="384" y="71" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#ffffff" font-weight="600">the database file</text><text x="384" y="90" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#ffffff">holds bytes that were never committed</text><rect x="372" y="120" width="340" height="62" rx="4" fill="var(--recovery-accent)" stroke="var(--line)" stroke-width="1"/><text x="384" y="145" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#ffffff" font-weight="600">the journal</text><text x="384" y="164" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#ffffff">holds what the committed state was</text><text x="8" y="236" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">so “the committed state is provable” and “these rows are current” are different claims</text>
</svg>

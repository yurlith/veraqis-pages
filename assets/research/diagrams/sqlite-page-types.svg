<svg viewBox="0 0 720 250" width="100%" height="auto" role="img" aria-labelledby="sqlite-page-types-t" preserveAspectRatio="xMinYMin meet" xmlns="http://www.w3.org/2000/svg">
<title id="sqlite-page-types-t">A table leaf page beside an index leaf page</title><desc>Two page kinds side by side. A table b-tree leaf starts with the byte 0x0D and its cell carries length, rowid and payload. An index b-tree leaf starts with 0x0A and its cell carries only length and payload, with the row key as the last column of the record. A WITHOUT ROWID table is stored as the second kind.</desc>
<text x="8" y="18" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600">table b-tree leaf</text><rect x="8" y="28" width="344" height="34" rx="4" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="20" y="50" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600">first byte of the page: 0x0D</text><rect x="8" y="84" width="63" height="38" rx="4" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="39.5" y="107" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="400" text-anchor="middle">length</text><rect x="71" y="84" width="63" height="38" rx="4" fill="var(--recovery-accent)" stroke="var(--line)" stroke-width="1"/><text x="102.5" y="107" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#ffffff" font-weight="700" text-anchor="middle">rowid</text><rect x="134" y="84" width="219" height="38" rx="4" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="243.5" y="107" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="400" text-anchor="middle">payload</text><text x="8" y="142" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">the row key sits in the cell</text><text x="8" y="160" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">a WITHOUT ROWID table never has this page type</text><text x="376" y="18" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600">index b-tree leaf</text><rect x="376" y="28" width="344" height="34" rx="4" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="388" y="50" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600">first byte of the page: 0x0A</text><rect x="376" y="84" width="63" height="38" rx="4" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="407.5" y="107" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="400" text-anchor="middle">length</text><rect x="439" y="84" width="281" height="38" rx="4" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="579.5" y="107" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="400" text-anchor="middle">payload — indexed columns, then the key</text><text x="376" y="142" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">the row key is the last column of the record</text><text x="376" y="160" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">and it is a rowid only for a rowid table</text><text x="8" y="240" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">the byte on the page decides how to read it; the schema text only describes it</text>
</svg>

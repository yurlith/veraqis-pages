<svg viewBox="0 0 720 260" width="100%" height="auto" role="img" aria-labelledby="orphan-ptrmap-t" preserveAspectRatio="xMinYMin meet" xmlns="http://www.w3.org/2000/svg">
<title id="orphan-ptrmap-t">An orphan page, its forward chain, and the pointer map that can corroborate it</title><desc>An orphan page holds the start of a record and a forward pointer to the page holding the rest. Because the page has lost its place in the b-tree, nothing vouches for that pointer. A pointer map, written separately to support vacuuming, states from the other direction that the second page is an overflow page owned by the first. When it confirms, the chain is followed; with no map or a disagreeing one, the row abstains.</desc>
<text x="8" y="20" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600">a record that continues onto another page</text><text x="8" y="38" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">the page has lost its place in the tree, so nothing vouches for the link</text><rect x="8" y="84" width="190" height="56" rx="4" fill="transparent" stroke="var(--bad)" stroke-width="1" stroke-dasharray="4 3"/><text x="103" y="108" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--bad)" font-weight="600" text-anchor="middle">orphan page 214</text><text x="103" y="126" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)" text-anchor="middle">start of the record</text><rect x="274" y="84" width="190" height="56" rx="4" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="369" y="108" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600" text-anchor="middle">page 215</text><text x="369" y="126" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)" text-anchor="middle">the rest of it</text><path d="M 198 104 L 266 104" stroke="var(--mut)" stroke-width="1.4"/><path d="M 266 100 L 274 104 L 266 108 Z" fill="var(--mut)"/><text x="236" y="72" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)" text-anchor="middle">forward chain: “continues at 215”</text><rect x="504" y="58" width="206" height="108" rx="4" fill="transparent" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/><text x="516" y="78" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600">pointer map</text><text x="516" y="98" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">page 215 is an overflow page</text><text x="516" y="114" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">owned by page 214</text><text x="516" y="138" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">written separately, for vacuuming</text><path d="M 500 112 L 470 112" stroke="var(--recovery-accent)" stroke-width="1.4"/><path d="M 478 108 L 470 112 L 478 116 Z" fill="var(--recovery-accent)"/><text x="8" y="206" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--recovery-accent)" font-weight="700">map confirms the link</text><text x="8" y="224" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">the chain is followed and the record assembled</text><text x="368" y="206" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--bad)" font-weight="700">no map, or the map disagrees</text><text x="368" y="224" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">the row abstains — the bytes are reported, not assembled</text>
</svg>

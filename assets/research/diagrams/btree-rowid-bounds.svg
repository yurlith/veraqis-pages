<svg viewBox="0 0 720 330" width="100%" height="auto" role="img" aria-labelledby="btree-bounds-t" preserveAspectRatio="xMinYMin meet" xmlns="http://www.w3.org/2000/svg">
<title id="btree-bounds-t">How the surviving neighbours of a deleted cell bound its rowid</title><desc>A leaf page whose middle cell has been deleted, between two surviving cells with rowids 4113 and 4115. Because the cell pointer array is ordered by ascending rowid, the missing key must be greater than 4113 and less than 4115, leaving exactly 4114. Above the leaf, the parent interior page supplies the same bound from its separator keys when the deleted cell had no left neighbour.</desc>
<text x="8" y="18" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">interior page — separator keys</text><rect x="8" y="30" width="150" height="44" rx="4" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="83" y="57" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600" text-anchor="middle">… sep 4096</text><rect x="172" y="30" width="150" height="44" rx="4" fill="var(--recovery-accent)" stroke="var(--line)" stroke-width="1"/><text x="247" y="57" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#ffffff" font-weight="600" text-anchor="middle">child page 12</text><rect x="336" y="30" width="150" height="44" rx="4" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="411" y="57" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600" text-anchor="middle">sep 4230 …</text><path d="M 247 74 L 247 128" stroke="var(--line)" stroke-width="1.4"/><text x="8" y="138" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)">leaf page 12 — cell pointer array, ordered by ascending rowid</text><rect x="8" y="150" width="150" height="56" rx="4" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="83" y="172" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)" text-anchor="middle">ordinal 0</text><text x="83" y="192" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600" text-anchor="middle">rowid 4113</text><rect x="172" y="150" width="150" height="56" rx="4" fill="transparent" stroke="var(--bad)" stroke-width="1" stroke-dasharray="4 3"/><text x="247" y="172" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)" text-anchor="middle">ordinal 1</text><text x="247" y="192" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--bad)" font-weight="600" text-anchor="middle">freeblock</text><rect x="336" y="150" width="150" height="56" rx="4" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="411" y="172" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)" text-anchor="middle">ordinal 2</text><text x="411" y="192" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)" font-weight="600" text-anchor="middle">rowid 4115</text><text x="247" y="226" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--mut)" text-anchor="middle">rowid varint overwritten by the freeblock header</text><rect x="8" y="250" width="704" height="66" rx="4" fill="transparent" stroke="var(--line)" stroke-width="1"/><text x="24" y="274" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)">lower bound = left neighbour + 1 = 4114</text><text x="24" y="294" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--ink)">upper bound = right neighbour − 1 = 4114</text><text x="696" y="284" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="var(--recovery-accent)" font-weight="700" text-anchor="end">one integer remains: rowid 4114</text>
</svg>
